<body>
<div id="setup-view" hidden></div>

<div id="main-view" hidden>
  <header class="app-header">
    <div class="header-row">
      <h1 class="brand"><img src="icon-192.png" alt="" width="30" height="30">読書録</h1>
      <label class="header-search">
        <span class="sr-only">本棚を検索</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="filter-input" class="input" type="search" placeholder="本棚を検索（書名・著者・感想・メモ）" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="header-actions">
        <span id="sync-indicator" class="sync-indicator" aria-live="polite"></span>
        <button id="add-btn" class="btn primary add-desktop" type="button">＋ 本を追加</button>
        <button id="settings-btn" class="btn icon ghost" type="button" aria-label="設定">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div id="offline-banner" class="offline-banner" hidden>インターネットに接続されていません。表示は最後に読み込んだ内容です（登録・編集はできません）。</div>
  <div id="notice-banner" class="notice-banner" role="alert" hidden></div>
  <div class="toolbar">
    <div class="view-switch" id="view-switch" role="tablist" aria-label="表示の切り替え">
      <button type="button" role="tab" data-view="shelf" aria-selected="true">本棚</button>
      <button type="button" role="tab" data-view="calendar" aria-selected="false">カレンダー</button>
    </div>
    <div class="chips" id="status-chips" role="group" aria-label="読書状態で絞り込み"></div>
    <div class="toolbar-right">
      <label class="sort">ジャンル
        <select id="genre-select" class="select"></select>
      </label>
      <label class="sort" id="sort-label">並び順
        <select id="sort-select" class="select"></select>
      </label>
    </div>
  </div>
  <main>
    <p id="result-note" class="result-note" hidden></p>
    <div id="shelf" class="shelf"></div>
    <div id="calendar" class="calendar" hidden></div>
    <div id="empty" class="empty" hidden></div>
  </main>
  <button id="fab" class="fab" type="button" aria-label="本を追加">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>追加
  </button>
</div>

<dialog id="detail-dialog" class="sheet" aria-label="本の詳細"></dialog>
<dialog id="add-dialog" class="sheet" aria-label="本を追加"></dialog>
<dialog id="settings-dialog" class="sheet" aria-label="設定"></dialog>
<dialog id="confirm-dialog" class="sheet narrow confirm" aria-label="確認"></dialog>
<div id="toast-area" class="toast-area" aria-live="polite"></div>

<noscript><p style="padding:24px">このアプリを使うには、JavaScript を有効にしてください。</p></noscript>
